<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#121C48"/>
      <stop offset="1" stop-color="#284A8E"/>
    </linearGradient>
    <path id="pillowShape" d="M22 14 C80 24 160 24 218 14 C226 12 230 16 228 24 C220 70 220 110 228 156 C230 164 226 168 218 166 C160 156 80 156 22 166 C14 168 10 164 12 156 C20 110 20 70 12 24 C10 16 14 12 22 14 Z"/>
    <!-- art sits inside a slightly inset pillow so a thin navy seam always frames it -->
    <clipPath id="inset">
      <use href="#pillowShape" transform="translate(120 90) scale(0.95 0.93) translate(-120 -90)"/>
    </clipPath>
  </defs>
  <use href="#pillowShape" fill="url(#sky)"/>
  <g clip-path="url(#inset)">
    <g transform="translate(20 -15)">
    <!-- spines: the full round back, tucked in -->
    <path d="M18 212 L18.0 149.8 L1.1 155.4 L20.7 133.8 L2.9 134.7 L27.5 118.9 L10.1 115.2 L38.0 106.4 L22.1 98.2 L51.3 97.0 L38.1 85.0 L66.6 91.5 L57.0 76.4 L82.9 90.1 L77.5 73.0 L98.9 93.0 L98.2 75.1 L113.7 99.9 L117.6 82.5 L130 108 C118 124 112 150 110 212 L0 212 Z" fill="#9499E6" stroke="#9499E6" stroke-width="6" stroke-linejoin="round"/>
    <!-- face -->
    <path d="M100 212 C104 150 112 118 128 112 C146 108 162 120 173 129 C181 136 177 146 167 146 C157 146 150 151 145 159 C141 166 140 180 140 212 Z" fill="#EEEFF6"/>
    <!-- eye, closed -->
    <path d="M138 123 Q144 129 150 123" fill="none" stroke="#171537" stroke-width="3.4" stroke-linecap="round"/>
    <!-- cheek -->
    <ellipse cx="148" cy="136" rx="6" ry="4" fill="#9499E6" opacity="0.55"/>
    <!-- nose -->
    <circle cx="175" cy="137" r="6" fill="#171537"/>
    </g>
    <!-- blanket swoosh -->
    <path d="M250 116 C222 118 204 130 186 139 C162 151 100 138 0 150 L0 200 L250 200 Z" fill="#B9C8FF"/>
    <!-- blanket fold, the S-curve running to the bottom edge -->
    <path d="M240 128 C212 134 192 150 178 164 C172 170 168 176 166 182 L157 182 C161 170 169 160 180 151 C198 138 216 130 240 128 Z" fill="#9499E6"/>
    <!-- sparkles -->
    <path d="M192 34 Q192 48 206 48 Q192 48 192 62 Q192 48 178 48 Q192 48 192 34 Z" fill="#EEEFF6"/>
    <path d="M214 64 Q214 71 221 71 Q214 71 214 78 Q214 71 207 71 Q214 71 214 64 Z" fill="#B9C8FF"/>
  </g>
</svg>
