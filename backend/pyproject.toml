[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the agentic pillow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic-settings>=2.15.0",
    "supabase>=2.33",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# The supabase/ folder (SQL migrations) would otherwise make ruff treat the SDK as first-party
known-third-party = ["supabase"]

[tool.ruff.lint.per-file-ignores]
# Inline SQL reads better unwrapped
"supabase/check_schema.py" = ["E501"]
