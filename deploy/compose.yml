# The public server on the VPS: the backend plus the calhacks-pillow tunnel that serves it as
# https://pillow.keanuc.net. Run by deploy/deploy.sh; see deploy/README.md.
#
# The Fetch.ai agents (agents/fetch/README.md) are opt-in: they start only with COMPOSE_PROFILES=fetch
# in deploy/.env on the VPS. They call the backend's API like any client; the backend never calls them,
# so stopping them changes nothing about the pillow, Night Watch or the alerts.
name: pillow

services:
  backend:
    build: ../backend
    env_file: /opt/pillow/backend.env
    environment:
      IMESSAGE_URL: http://imessage:8787  # the sidecar below, on the compose network only
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"  # loopback only: deploy.sh's health check; the public path is the tunnel
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Sends family alerts as iMessages through Photon (photon.codes); reads SPECTRUM_PROJECT_ID and
  # SPECTRUM_PROJECT_SECRET from the same env file. No published port: only the backend calls it.
  imessage:
    build: ./imessage
    env_file: /opt/pillow/backend.env
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    restart: unless-stopped
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      - /opt/pillow/tunnel.json:/etc/cloudflared/tunnel.json:ro  # the secret; never in git
    depends_on:
      - backend

  fetch-coordinator:
    profiles: [fetch]
    build: ../agents/fetch
    command: ["python", "/app/coordinator_agent.py"]
    env_file: /opt/pillow/fetch-coordinator.env  # AGENT_SEED, CHECKIN_TOKEN, AGENTVERSE_API_KEY
    environment:
      PILLOW_SERVER: http://backend:8000
    volumes:
      - fetch-coordinator:/data
    restart: unless-stopped
    depends_on:
      - backend

  fetch-family-1:
    profiles: [fetch]
    build: ../agents/fetch
    command: ["python", "/app/family_agent.py"]
    env_file: /opt/pillow/fetch-family-1.env  # + CONTACT_ID, CONTACT_NAME, COORDINATOR_ADDRESS, ANTHROPIC_API_KEY
    environment:
      PILLOW_SERVER: http://backend:8000
    volumes:
      - fetch-family-1:/data
    restart: unless-stopped
    depends_on:
      - backend

  fetch-family-2:
    profiles: [fetch]
    build: ../agents/fetch
    command: ["python", "/app/family_agent.py"]
    env_file: /opt/pillow/fetch-family-2.env
    environment:
      PILLOW_SERVER: http://backend:8000
    volumes:
      - fetch-family-2:/data
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  fetch-coordinator:
  fetch-family-1:
  fetch-family-2:
