# Backend CI: lint and test every PR; deploy master to the VPS (deploy/README.md).
name: backend

on:
  pull_request:
    paths: ["backend/**", "deploy/**", "agents/fetch/**", ".github/workflows/backend.yml"]
  push:
    branches: [master]
    paths: ["backend/**", "deploy/**", "agents/fetch/**", ".github/workflows/backend.yml"]
  workflow_dispatch:  # redeploy master by hand from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key's authorized_keys entry forces deploy/deploy.sh; the command is only the sha
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "deploy@$DEPLOY_HOST" "$GITHUB_SHA"
      - name: Public health check
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://pillow.keanuc.net/api/health
