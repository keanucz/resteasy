# Backend CI: lint and test every PR and every push to master. The VPS deploy was removed after
# Cal Hacks 13.0 (2026-10-25), when the pillow stack was taken off the server.
name: backend

on:
  # Every PR, so "test" can be a required check on master even for PRs that don't touch the backend
  pull_request:
  push:
    branches: [master]
    paths: ["backend/**", "deploy/**", "agents/fetch/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

